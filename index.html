<!DOCTYPE html>
<html>
<head>
    <title>AlGOL - Game of Life</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <canvas id="gl-canvas" width="800" height="500"></canvas>
    <div class="panel left-panel panel-shown">
        <div class="panel-item">FPS: <span id="fps-counter">0</span></div>
    </div>
    <div class="panel right-panel">
        <div class="panel-item">
            <p style="text-decoration: underline;">Controls:</p>
            <p>Click+drag to move around the map</p>
            <p>Use mouse wheel to zoom in and out</p>
            <input type="range" id="iteration-slider" name="iterations" min="0" max="120" value="9" list="iteration-detents">
            <datalist id="iteration-detents">
                <option value="60">
            </datalist>
            <label for="iterations">Iterations</label>
            <p>Simulation speed: <span id="speed-label"></span></p>
        </div>
        <div class="panel-item">Generation: <span id="generation-counter">0</span></div>
    </div>
    <div class="bottom-panel panel-item panel-button" id="gui-toggle">Toggle GUI</div>
    <script src="algol.js"></script>
</body>
</html>
