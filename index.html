<!DOCTYPE html>
<html>
<head>
    <title>AlGOL - Game of Life</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <canvas id="gl-canvas" width="800" height="500"></canvas>
    <div class="panel left-panel">
        <div class="panel-item" id="fps-counter">FPS: 0</div>
    </div>
    <div class="panel right-panel">
        <div class="panel-item">
            <p>Controls:</p>
            <p>Click to drag around</p>
        </div>
        <div class="panel-item" id="generation-counter">Generation: 0</div>
    </div>
    <div class="bottom-panel panel-item panel-button" id="gui-toggle">Toggle GUI</div>
    <script src="algol.js" type="module"></script>
</body>
</html>
