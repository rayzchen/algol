<!DOCTYPE html>
<html>
<head>
    <title>AlGOL - Game of Life</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <canvas id="gl-canvas"></canvas>
    <canvas id="minimap-canvas" class="minimap-canvas"></canvas>
    <div class="panel left-panel panel-shown">
        <div class="panel-row">
            <div class="panel-item">FPS: <span id="fps-counter">0</span></div>
            <div class="panel-item">Generation: <span id="generation-counter">0</span></div>
        </div>
    </div>
    <div class="panel right-panel">
        <div class="panel-item">
            <p style="text-decoration: underline;">Controls:</p>
            <p>Click+drag to move around the map</p>
            <p>Use mouse wheel or <code>[+]/[_]</code><br>to zoom in and out</p>
            <p><code>[=]/[-]</code>: Change simulation speed</p>
            <p>Current scale: <span id="scale-label">2.0</span></p>
            <div class="input-container">
                <input type="range" id="iteration-slider" name="iterations" min="0" max="200" value="52" list="iteration-detents">
                <datalist id="iteration-detents">
                    <option value="60">
                </datalist>
                <label for="iterations">Speed: <span id="speed-label"></span></label>
            </div>
            <div class="input-container">
                <input type="checkbox" id="wrap-checkbox" name="wrap" checked>
                <label for="wrap">Wrap grid</label>
            </div>
            <div class="input-container">
                <input type="checkbox" id="minimap-checkbox" name="minimap" checked>
                <label for="minimap">Enable minimap</label>
            </div>
        </div>
        <div class="panel-row">
            <div class="panel-item panel-button" id="pause-toggle">Pause</div>
            <div class="panel-item panel-button" id="step-button">Step</div>
            <div class="panel-item panel-button" id="reset-button">Reset view</div>
            <div class="panel-item panel-button" id="theme-toggle">Theme: <span id="theme-label">Color</span></div>
        </div>
        <div class="panel-row">
            <div class="panel-item panel-button loader">Load glider</div>
            <div class="panel-item panel-button loader">Load glidergun</div>
            <div class="panel-item panel-button loader">Load breeder1</div>
        </div>
    </div>
    <div class="bottom-panel panel-item panel-button" id="gui-toggle">Toggle GUI</div>
    <script src="algol.js" type="module"></script>
</body>
</html>
